<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orderly | Diagrams</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/diagram.css">
  <script defer src="assets/js/diagram/data.js"></script>
  <script defer src="assets/js/diagram/app.js"></script>
</head>
<body class="diagram-page">
  <header class="topbar">
    <div>
      <p class="eyebrow">ORDERLY</p>
      <h1>Diagrams</h1>
      <p class="subtitle">Draw shapes on an infinite canvas. Changes save in this browser.</p>
    </div>
    <div class="actions">
      <a href="index.html" class="secondary link-button">Board</a>
      <button id="theme-toggle" class="secondary" type="button" aria-pressed="false">Switch to dark mode</button>
      <button id="import-button" class="secondary" type="button">Import JSON</button>
      <button id="export-button" class="secondary" type="button">Export JSON</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main class="diagram-main">
    <div id="theme-notice" role="status" aria-live="polite"></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <section class="diagram-toolbar" aria-label="Diagram tools">
      <div class="tool-group" role="group" aria-label="Tools">
        <button type="button" class="tool-button" data-tool="select" aria-pressed="true">Select</button>
        <button type="button" class="tool-button" data-tool="pan" aria-pressed="false">Pan</button>
        <button type="button" class="tool-button" data-tool="rect" aria-pressed="false">Rectangle</button>
        <button type="button" class="tool-button" data-tool="ellipse" aria-pressed="false">Ellipse</button>
        <button type="button" class="tool-button" data-tool="line" aria-pressed="false">Line</button>
        <button type="button" class="tool-button" data-tool="text" aria-pressed="false">Text</button>
      </div>
      <p class="diagram-hint">Drag to draw shapes or lines. Hold Space and drag to pan. Scroll to zoom. Delete removes the selection.</p>
    </section>
    <section id="canvas-wrap" class="diagram-canvas-wrap" tabindex="0" aria-label="Diagram canvas">
      <svg id="diagram-svg" class="diagram-svg" xmlns="http://www.w3.org/2000/svg">
        <rect class="diagram-surface" width="100%" height="100%" fill="transparent"></rect>
        <g id="viewport-group"></g>
        <g id="overlay-group"></g>
      </svg>
    </section>
  </main>
  <dialog id="text-dialog">
    <form id="text-form">
      <div class="dialog-heading">
        <h2>Edit text</h2>
        <button type="button" class="icon-button close-dialog" aria-label="Close">×</button>
      </div>
      <label>Text <textarea name="text" rows="4" autofocus></textarea></label>
      <div class="dialog-actions">
        <button type="button" class="secondary close-dialog">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
